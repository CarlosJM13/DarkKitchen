<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dark Kitchen - Menú</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;}
        button.delete { background: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gestión de Platillos (CRUD Web)</h2>

    <div class="form-group">
        <input type="text" id="nombre" placeholder="Nombre del Platillo" required>
        <input type="number" id="precio" placeholder="Precio ($)" step="0.01" required>
        <input type="number" id="costo" placeholder="Costo Preparación ($)" step="0.01" required>
        <button onclick="crearPlatillo()">Agregar</button>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Costo</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody id="tabla-platillos">
        <!-- Los datos se cargarán aquí desde Java -->
        </tbody>
    </table>
</div>

<script>
    const API_URL = '/api/platillos';

    // Función para Cargar (Leer) los datos
    async function cargarPlatillos() {
        const respuesta = await fetch(API_URL);
        const platillos = await respuesta.json();
        const tbody = document.getElementById('tabla-platillos');
        tbody.innerHTML = '';

        platillos.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.idPlatillo}</td>
                    <td>${p.nombre}</td>
                    <td>$${p.precio}</td>
                    <td>$${p.costoPreparacion}</td>
                    <td><button class="delete" onclick="eliminarPlatillo(${p.idPlatillo})">Eliminar</button></td>
                </tr>
            `;
        });
    }

    // Función para Crear
    async function crearPlatillo() {
        const nuevo = {
            nombre: document.getElementById('nombre').value,
            precio: parseFloat(document.getElementById('precio').value),
            costoPreparacion: parseFloat(document.getElementById('costo').value)
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(nuevo)
        });

        document.getElementById('nombre').value = '';
        document.getElementById('precio').value = '';
        document.getElementById('costo').value = '';
        cargarPlatillos(); // Recargar la tabla
    }

    // Función para Eliminar
    async function eliminarPlatillo(id) {
        if(confirm('¿Seguro que deseas eliminar este platillo?')) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            cargarPlatillos(); // Recargar la tabla
        }
    }

    // Cargar al iniciar la página
    window.onload = cargarPlatillos;
</script>

</body>
</html>
