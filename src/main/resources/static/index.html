<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dark Kitchen - Tienda en Línea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; }
        .hero { background: #212529; color: white; padding: 40px 0; text-align: center; }
        .carrito-panel { background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; position: sticky; top: 20px;}
    </style>
</head>
<body>

<header class="hero">
    <div class="container d-flex justify-content-between align-items-center">
        <h2 class="mb-0"><i class="fa-solid fa-fire-burner text-warning"></i> Dark Kitchen</h2>
        <a href="admin.html" class="btn btn-outline-light"><i class="fa-solid fa-lock"></i> Admin</a>
    </div>
</header>

<div class="container my-5">
    <div class="row">
        <!-- SECCIÓN IZQUIERDA: MENÚ -->
        <div class="col-md-8">
            <h4 class="mb-4">Nuestro Menú</h4>
            <div class="row" id="catalogo-platillos"></div>
        </div>

        <!-- SECCIÓN DERECHA: CARRITO Y DATOS -->
        <div class="col-md-4">
            <div class="carrito-panel">
                <h5 class="mb-3"><i class="fa-solid fa-cart-shopping text-primary"></i> Tu Pedido</h5>

                <div class="mb-3">
                    <label class="form-label fw-bold">1. Selecciona tu usuario:</label>
                    <select id="selector-cliente" class="form-select">
                        <option value="">-- Elige un cliente --</option>
                    </select>
                    <small class="text-muted">Si no estás, regístrate en el panel Admin.</small>
                </div>

                <hr>
                <div class="mb-3">
                    <label class="form-label fw-bold">2. Platillos seleccionados:</label>
                    <ul id="lista-carrito" class="list-group mb-3">
                        <li class="list-group-item text-muted text-center">Tu carrito está vacío</li>
                    </ul>
                    <h4 class="text-end">Total: $<span id="total-carrito">0.00</span></h4>
                </div>

                <button class="btn btn-success w-100 btn-lg" onclick="enviarPedido()"><i class="fa-solid fa-check"></i> Confirmar Pedido</button>
            </div>
        </div>
    </div>
</div>

<script>
    let carrito = [];

    // Cargar Catálogo
    async function cargarMenu() {
        const res = await fetch('/api/platillos');
        const platillos = await res.json();
        const contenedor = document.getElementById('catalogo-platillos');
        contenedor.innerHTML = '';
        platillos.forEach(p => {
            contenedor.innerHTML += `
                <div class="col-md-6 mb-3">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-body text-center">
                            <h5 class="fw-bold">${p.nombre}</h5>
                            <h4 class="text-danger">$${p.precio}</h4>
                            <button class="btn btn-outline-primary mt-2" onclick="agregarAlCarrito(${p.idPlatillo}, '${p.nombre}', ${p.precio})">
                                <i class="fa-solid fa-plus"></i> Agregar
                            </button>
                        </div>
                    </div>
                </div>`;
        });
    }

    // Cargar Lista de Clientes en el Desplegable
    async function cargarClientes() {
        const res = await fetch('/api/clientes');
        const clientes = await res.json();
        const selector = document.getElementById('selector-cliente');
        clientes.forEach(c => {
            selector.innerHTML += `<option value="${c.idCliente}">${c.nombre} (${c.correo})</option>`;
        });
    }

    // Lógica del Carrito
    function agregarAlCarrito(id, nombre, precio) {
        const existente = carrito.find(item => item.idPlatillo === id);
        if (existente) {
            existente.cantidad++;
        } else {
            carrito.push({ idPlatillo: id, nombre: nombre, precioUnitario: precio, cantidad: 1 });
        }
        actualizarCarritoUI();
    }

    function actualizarCarritoUI() {
        const lista = document.getElementById('lista-carrito');
        lista.innerHTML = '';
        let total = 0;

        if(carrito.length === 0) {
            lista.innerHTML = '<li class="list-group-item text-muted text-center">Tu carrito está vacío</li>';
        } else {
            carrito.forEach((item, index) => {
                total += (item.precioUnitario * item.cantidad);
                lista.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        ${item.cantidad}x ${item.nombre}
                        <span>$${item.precioUnitario * item.cantidad} <button class="btn btn-sm btn-danger ms-2" onclick="quitarItem(${index})"><i class="fa-solid fa-xmark"></i></button></span>
                    </li>`;
            });
        }
        document.getElementById('total-carrito').innerText = total.toFixed(2);
    }

    function quitarItem(index) {
        carrito.splice(index, 1);
        actualizarCarritoUI();
    }

    // Enviar a Base de Datos
    async function enviarPedido() {
        const idCliente = document.getElementById('selector-cliente').value;
        if (!idCliente) return Swal.fire('Error', 'Debes seleccionar un cliente primero.', 'error');
        if (carrito.length === 0) return Swal.fire('Error', 'Tu carrito está vacío.', 'error');

        const total = carrito.reduce((sum, item) => sum + (item.precioUnitario * item.cantidad), 0);

        const payload = { idCliente: parseInt(idCliente), total: total, detalles: carrito };

        const res = await fetch('/api/pedidos', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });

        if(res.ok) {
            Swal.fire('¡Pedido Confirmado!', 'Tu pedido se ha enviado a cocina.', 'success');
            carrito = [];
            actualizarCarritoUI();
        } else {
            const error = await res.text();
            Swal.fire('Error en BD', error, 'error');
        }
    }

    window.onload = () => { cargarMenu(); cargarClientes(); };
</script>
</body>
</html>
