<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Dark Kitchen</title>
    <!-- BLOQUEO POR CONTRASEÑA -->
    <script>
        const pass = prompt("Acceso Restringido. Ingrese contraseña de Administrador:");
        if (pass !== "1234") {
            alert("Contraseña incorrecta. Redirigiendo...");
            window.location.href = "index.html";
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fc; }
        .sidebar { min-height: 100vh; background-color: #212529; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 15px 20px; display: block; }
        .sidebar a.active { background-color: #343a40; color: #fff; border-left: 4px solid #0d6efd; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- BARRA LATERAL -->
        <div class="col-md-2 sidebar d-none d-md-block">
            <h4 class="text-center mb-4 text-white"><i class="fa-solid fa-lock text-primary"></i> Admin DK</h4>
            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
                <a class="nav-link active" data-bs-toggle="pill" href="#menu"><i class="fa-solid fa-burger me-2"></i> Menú</a>
                <a class="nav-link" data-bs-toggle="pill" href="#pedidos"><i class="fa-solid fa-receipt me-2"></i> Pedidos</a>
                <a class="nav-link" data-bs-toggle="pill" href="#clientes"><i class="fa-solid fa-users me-2"></i> Clientes</a>
                <a class="nav-link" href="/estadisticas.html"><i class="fa-solid fa-chart-column me-2"></i> Estadísticas</a>
                <a class="nav-link bg-danger text-white mt-4" href="index.html"><i class="fa-solid fa-right-from-bracket me-2"></i> Salir</a>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="col-md-10 p-4">
            <div class="tab-content">

                <!-- PESTAÑA: MENÚ (CON VALIDACIÓN) -->
                <div class="tab-pane fade show active" id="menu">
                    <h2>Gestión de Platillos</h2>
                    <div class="card mb-4 shadow-sm p-3">
                        <div class="row g-2">
                            <div class="col-md-4"><input type="text" class="form-control" id="nombrePlatillo" placeholder="Nombre (Ej. Pizza)"></div>
                            <div class="col-md-3"><input type="number" class="form-control" id="precioPlatillo" placeholder="Precio ($)"></div>
                            <div class="col-md-3"><input type="number" class="form-control" id="costoPlatillo" placeholder="Costo ($)"></div>
                            <div class="col-md-2"><button class="btn btn-primary w-100" onclick="crearPlatillo()">Agregar</button></div>
                        </div>
                    </div>
                    <table class="table table-hover bg-white text-center shadow-sm">
                        <thead class="table-dark"><tr><th>ID</th><th>Platillo</th><th>Precio</th><th>Costo</th><th>Acciones</th></tr></thead>
                        <tbody id="tabla-platillos"></tbody>
                    </table>
                </div>

                <!-- PESTAÑA NUEVA: PEDIDOS RECIENTES -->
                <div class="tab-pane fade" id="pedidos">
                    <h2>Pedidos Recientes</h2>
                    <button class="btn btn-outline-success mb-3" onclick="cargarPedidos()"><i class="fa-solid fa-rotate"></i> Refrescar Tabla</button>
                    <table class="table table-hover bg-white text-center shadow-sm">
                        <thead class="table-dark"><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Estado</th><th>Total</th></tr></thead>
                        <tbody id="tabla-pedidos"></tbody>
                    </table>
                </div>

                <!-- PESTAÑA: CLIENTES -->
                <div class="tab-pane fade" id="clientes">
                    <h2>Directorio de Clientes</h2>
                    <div class="card mb-4 shadow-sm p-3">
                        <div class="row g-2">
                            <div class="col-md-3"><input type="text" class="form-control" id="nomCliente" placeholder="Nombre completo"></div>
                            <div class="col-md-3"><input type="text" class="form-control" id="telCliente" placeholder="Teléfono"></div>
                            <div class="col-md-4"><input type="email" class="form-control" id="correoCliente" placeholder="Correo Electrónico"></div>
                            <div class="col-md-2"><button class="btn btn-success w-100" onclick="crearCliente()">Registrar</button></div>
                        </div>
                    </div>
                    <table class="table table-hover bg-white text-center shadow-sm">
                        <thead class="table-primary"><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Correo</th></tr></thead>
                        <tbody id="tabla-clientes"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- LÓGICA DE PLATILLOS CON VALIDACIÓN ---
    async function cargarPlatillos() {
        const data = await (await fetch('/api/platillos')).json();
        let html = '';
        data.forEach(p => { html += `<tr><td>${p.idPlatillo}</td><td>${p.nombre}</td><td>$${p.precio}</td><td>$${p.costoPreparacion}</td><td><button class="btn btn-sm btn-danger" onclick="eliminarPlatillo(${p.idPlatillo})"><i class="fa-solid fa-trash"></i></button></td></tr>`; });
        document.getElementById('tabla-platillos').innerHTML = html;
    }

    async function crearPlatillo() {
        const nombre = document.getElementById('nombrePlatillo').value.trim();
        const precio = document.getElementById('precioPlatillo').value;
        const costo = document.getElementById('costoPlatillo').value;

        // VALIDACIÓN: Evita enviar datos en blanco
        if(nombre === '' || precio === '' || costo === '') {
            return Swal.fire('Error', 'Por favor llena todos los campos para registrar un platillo.', 'error');
        }

        await fetch('/api/platillos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nombre: nombre, precio: parseFloat(precio), costoPreparacion: parseFloat(costo) }) });

        document.getElementById('nombrePlatillo').value = ''; document.getElementById('precioPlatillo').value = ''; document.getElementById('costoPlatillo').value = '';
        cargarPlatillos();
    }

    async function eliminarPlatillo(id) { if(confirm('¿Eliminar platillo?')) { await fetch(`/api/platillos/${id}`, { method: 'DELETE' }); cargarPlatillos(); } }

    // --- LÓGICA DE CLIENTES ---
    async function cargarClientes() {
        const data = await (await fetch('/api/clientes')).json();
        let html = '';
        data.forEach(c => { html += `<tr><td>${c.idCliente}</td><td>${c.nombre}</td><td>${c.telefono}</td><td>${c.correo}</td></tr>`; });
        document.getElementById('tabla-clientes').innerHTML = html;
    }

    async function crearCliente() {
        const c = { nombre: document.getElementById('nomCliente').value, telefono: document.getElementById('telCliente').value, direccion: '', correo: document.getElementById('correoCliente').value };
        const res = await fetch('/api/clientes', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(c) });
        if(!res.ok) Swal.fire('Error SQL', await res.text(), 'error');
        else { Swal.fire('Éxito', await res.text(), 'success'); cargarClientes(); }
    }

    // --- LÓGICA DE PEDIDOS ---
    async function cargarPedidos() {
        const data = await (await fetch('/api/pedidos')).json();
        let html = '';
        data.forEach(p => { html += `<tr><td>#${p.id}</td><td>${p.fecha}</td><td>${p.cliente}</td><td><span class="badge bg-warning text-dark">${p.estado}</span></td><td class="fw-bold text-success">$${p.total}</td></tr>`; });
        document.getElementById('tabla-pedidos').innerHTML = html;
    }

    window.onload = () => { cargarPlatillos(); cargarClientes(); cargarPedidos(); };
</script>
</body>
</html>
